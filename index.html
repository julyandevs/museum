<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A Digital Philippine Heritage Gallery</title>
<link rel="icon" type="image/png" href="bg/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0C0B0A;
    --plaster:#EDE6D6;  
    --clay-hi:#D4AF77;
    --muted:#BDB5A3;
    --rule:rgba(180,145,90,0.2);
    --serif:'Fraunces', Georgia, serif;
    --sans:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --gutter:clamp(24px, 6vw, 88px);
    --ease:cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{
    height:100%;
    background:var(--ink);
    color:var(--plaster);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .bg{
    position:fixed; inset:0;
    background:
      linear-gradient(90deg, rgba(12,11,10,0.97) 0%, rgba(12,11,10,0.8) 52%, rgba(12,11,10,0.92) 100%),
      url('bg/national_musuem_bg.png') center 40% / cover no-repeat;
    transform:scale(1.04);
    animation:drift 20s ease-in-out infinite alternate;
  }
  @keyframes drift{
    from{ transform:scale(1.04) translateX(0); }
    to{ transform:scale(1.09) translateX(-1%); }
  }

  .stage-wrap{
    position:relative;
    height:100%;
    transition:opacity 0.9s ease, transform 0.9s ease;
  }
  .stage-wrap.leaving{ opacity:0; transform:scale(1.02); }

  .stage{
    position:relative;
    height:100%;
    max-width:1100px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:0 var(--gutter) 120px;
  }

  .eyebrow{
    font-size:15px;
    color:var(--clay-hi);
    margin-bottom:22px;
    opacity:0;
    animation:rise 1s var(--ease) 0.3s forwards;
  }

  .title{
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(46px, 7.6vw, 104px);
    line-height:0.98;
    letter-spacing:-0.035em;
    max-width:12ch;
    opacity:0;
    animation:rise 1.1s var(--ease) 0.5s forwards;
  }

  .subtitle{
    margin-top:30px;
    max-width:40ch;
    font-size:18px;
    line-height:1.5;
    color:var(--muted);
    opacity:0;
    animation:rise 1s var(--ease) 0.9s forwards;
  }

  .loader{
    position:absolute;
    left:var(--gutter);
    right:var(--gutter);
    bottom:64px;
    max-width:420px;
    opacity:0;
    animation:rise 1s var(--ease) 1.2s forwards;
  }
  .status{
    font-size:14px;
    color:var(--plaster);
    margin-bottom:14px;
    min-height:1.4em;
  }
  .track{
    position:relative;
    height:2px;
    background:var(--rule);
    overflow:hidden;
  }
  .fill{
    position:absolute; inset:0;
    background:var(--clay-hi);
    transform-origin:0 50%;
    transform:scaleX(0);
  }

  .footer-line{
    position:fixed;
    right:var(--gutter);
    bottom:64px;
    font-size:13px;
    color:var(--muted);
    opacity:0;
    animation:fade 1.2s ease 1.6s forwards;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes fade{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  @media (max-width:700px){
    .stage{ justify-content:flex-end; padding-bottom:200px; }
    .title{ font-size:clamp(40px, 11vw, 60px); }
    .footer-line{ display:none; }
    .loader{ bottom:48px; }
  }

  @media (prefers-reduced-motion: reduce){
    .bg{ animation:none; }
    .eyebrow,.title,.subtitle,.loader,.footer-line{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

<div class="bg" role="img" aria-label="Facade of the National Museum of the Philippines"></div>

<main class="stage-wrap" id="stageWrap">
  <div class="stage">
    <p class="eyebrow">OLHUM001 · Final project · Group 4</p>
    <h1 class="title">A Digital Philippine Heritage Gallery</h1>
    <p class="subtitle">Preserving the nation's story, one artifact at a time.</p>

    <div class="loader">
      <div class="status" id="status" aria-live="polite">Preparing the collection</div>
      <div class="track"><div class="fill" id="progressFill"></div></div>
    </div>
  </div>
</main>

<p class="footer-line">Hiyas ng Kasaysayan · OLTA211A001SC</p>

<script>
(function () {
  const statusEl = document.getElementById('status');
  const fill = document.getElementById('progressFill');
  const wrap = document.getElementById('stageWrap');

  const messages = [
    { at: 0,  text: "Preparing the collection" },
    { at: 25, text: "Unlocking the archives" },
    { at: 55, text: "Arranging the exhibits" },
    { at: 80, text: "Polishing the frames" },
    { at: 97, text: "Opening the gallery" }
  ];

  const duration = 5000;
  const destination = "museum.html";
  let startTime = null;

  function currentMessage(progress) {
    let message = messages[0].text;
    messages.forEach((m) => { if (progress >= m.at) message = m.text; });
    return message;
  }

  function tick(timestamp) {
    if (startTime === null) startTime = timestamp;
    const progress = Math.min(100, ((timestamp - startTime) / duration) * 100);

    fill.style.transform = `scaleX(${progress / 100})`;
    const message = currentMessage(progress);
    if (statusEl.textContent !== message) statusEl.textContent = message;

    if (progress < 100) {
      requestAnimationFrame(tick);
    } else {
      setTimeout(finish, 200);
    }
  }

  function finish() {
    statusEl.textContent = "Welcome";
    wrap.classList.add('leaving');
    setTimeout(function () {
      sessionStorage.setItem("openedFromLoader", "true");
      window.location.replace(destination);
    }, 850);
  }

  window.addEventListener('load', function () {
    setTimeout(function () { requestAnimationFrame(tick); }, 260);
  });
})();
</script>

</body>
</html>
